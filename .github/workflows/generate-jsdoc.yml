name: Generate JSDoc

on:
  push:
    branches:
      - main
      - master

jobs:
  generate-jsdoc:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --global jsdoc
          npm install --global docdash

      - name: Generate JSDoc documentation
        run: |
          mkdir -p docs
          jsdoc -r app/src -d docs -R README.md -c .jsdocrc.json || jsdoc -r app/src -d docs -R README.md

      - name: Commit and push documentation
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs
          git diff --quiet && git diff --staged --quiet || (git commit -m "📝 Update JSDoc documentation [skip ci]" && git push)
